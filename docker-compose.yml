services:
  # Microservice 1: The FastAPI Backend
  api:
    build: .
    # We expose it on 0.0.0.0 so Docker can route traffic to it
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/daily-tasks || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # This mounts your local SQLite database into the container so you don't lose your seeded data
      - ./tasks.db:/app/tasks.db

  # Microservice 2: The Telegram Bot
  worker:
    build: .
    command: uv run python worker/bot.py
    env_file:
      - .env
    environment:
      # Docker's Internal DNS allows the bot to talk to the API using the service name 'api'
      - BACKEND_URL=http://api:8000
    depends_on:
      - api
